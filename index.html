<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" type="image/jpg" href="img/favicon.ico" />
    <title>Robotron 2000</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Teko:wght@300;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <section class="robotron">
        <img class="robo" src="img/robotron.png" alt="Robotron" id="robotron" />
        <h1 class="titulo">ROBOTRON <br />2000</h1>
      </section>

      <section class="box estatisticas" aria-label="Estatísticas do robô" aria-live="polite">
        <div class="estatistica">
          <p class="estatistica-titulo">Força</p>
          <div class="estatistica-valor">
            <p class="estatistica-numero" data-estatistica="forca">0</p>
          </div>
        </div>
        <div class="estatistica">
          <p class="estatistica-titulo">Poder</p>
          <div class="estatistica-valor">
            <p class="estatistica-numero" data-estatistica="poder">0</p>
          </div>
        </div>
        <div class="estatistica">
          <p class="estatistica-titulo">Energia</p>
          <div class="estatistica-valor">
            <p class="estatistica-numero" data-estatistica="energia">0</p>
          </div>
        </div>
        <div class="estatistica">
          <p class="estatistica-titulo">Velocidade</p>
          <div class="estatistica-valor">
            <p class="estatistica-numero" data-estatistica="velocidade">0</p>
          </div>
        </div>
      </section>

      <section class="equipamentos">
        <form action="" class="montador">
          <div class="box montador-conteudo">
            <div class="peca">
              <label for="bracos" class="peca-titulo">Braços</label>
              <div class="controle">
                <button type="button" class="controle-ajuste" aria-label="Remover braços" data-controle="-" data-peca="bracos">-</button>
                <input type="text" id="bracos" readonly class="controle-contador" value="00" data-contador/>
                <button type="button" class="controle-ajuste" aria-label="Adicionar braços" data-controle="+" data-peca="bracos">+</button>
              </div>
            </div>
            <hr class="linha" />
            <div class="peca">
              <label for="blindagem" class="peca-titulo">Blindagem</label>
              <div class="controle">
                <button type="button" class="controle-ajuste" aria-label="Remover blindagem" data-controle="-" data-peca="blindagem">-</button>
                <input type="text" id="blindagem" readonly class="controle-contador" value="00" data-contador/>
                <button type="button" class="controle-ajuste" aria-label="Adicionar blindagem" data-controle="+" data-peca="blindagem">+</button>
              </div>
            </div>
            <hr class="linha" />
            <div class="peca">
              <label for="nucleos" class="peca-titulo">Núcleos</label>
              <div class="controle">
                <button type="button" class="controle-ajuste" aria-label="Remover núcleos" data-controle="-" data-peca="nucleos">-</button>
                <input type="text" id="nucleos" readonly class="controle-contador" value="00" data-contador/>
                <button type="button" class="controle-ajuste" aria-label="Adicionar núcleos" data-controle="+" data-peca="nucleos">+</button>
              </div>
            </div>
            <hr class="linha" />
            <div class="peca">
              <label for="pernas" class="peca-titulo">Pernas</label>
              <div class="controle">
                <button type="button" class="controle-ajuste" aria-label="Remover pernas" data-controle="-" data-peca="pernas">-</button>
                <input type="text" id="pernas" readonly class="controle-contador" value="00" data-contador/>
                <button type="button" class="controle-ajuste" aria-label="Adicionar pernas" data-controle="+" data-peca="pernas">+</button>
              </div>
            </div>
            <hr class="linha" />
            <div class="peca">
              <label for="foguetes" class="peca-titulo">Foguetes</label>
              <div class="controle">
                <button type="button" class="controle-ajuste" aria-label="Remover foguetes" data-controle="-" data-peca="foguetes">-</button>
                <input type="text" id="foguetes" readonly class="controle-contador" value="00" data-contador/>
                <button type="button" class="controle-ajuste" aria-label="Adicionar foguetes" data-controle="+" data-peca="foguetes">+</button>
              </div>
            </div>
          </div>
          <input
            type="submit"
            value="Iniciar produção"
            class="producao"
            id="producao"
          />
        <p id="status" role="status"></p></form>
        
      </section>
      
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
